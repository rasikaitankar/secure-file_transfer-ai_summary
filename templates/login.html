<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SecureFileShare — Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"/>
  <style>
    .login-wrap {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
    }
    .login-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 40px 36px;
      width: 100%;
      max-width: 420px;
    }
    .login-logo {
      font-size: 2.4rem;
      text-align: center;
      margin-bottom: 8px;
    }
    .login-title {
      text-align: center;
      font-family: var(--mono);
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--accent);
      margin-bottom: 4px;
    }
    .login-sub {
      text-align: center;
      font-size: 0.78rem;
      color: var(--text-muted);
      margin-bottom: 28px;
    }
    .demo-users {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px 16px;
      margin-top: 20px;
    }
    .demo-users .label {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      font-weight: 600;
      margin-bottom: 8px;
    }
    .demo-user-btn {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 4px 10px;
      font-family: var(--mono);
      font-size: 0.78rem;
      color: var(--accent);
      cursor: pointer;
      margin: 2px;
      transition: all 0.15s;
    }
    .demo-user-btn:hover {
      background: rgba(88,166,255,0.1);
      border-color: var(--accent);
    }
    .cookie-note {
      font-size: 0.72rem;
      color: var(--text-muted);
      text-align: center;
      margin-top: 16px;
      font-family: var(--mono);
    }
  </style>
</head>
<body>
<div class="login-wrap">
  <div class="login-card">
    <div class="login-logo"></div>
    <div class="login-title">SecureFileShare</div>
    <div class="login-sub">Computer Networks Mini Project — Login to continue</div>

    <div id="loginStatus"></div>

    <div class="mb-3">
      <label class="form-label" for="username">Username</label>
      <input type="text" class="form-control" id="username" placeholder="e.g. alice" autocomplete="username"/>
    </div>
    <div class="mb-3">
      <label class="form-label" for="password">Password</label>
      <input type="password" class="form-control" id="password" placeholder="Password" autocomplete="current-password"/>
    </div>

    <button class="btn btn-primary w-100 mb-2" id="loginBtn" onclick="doLogin()">
       Login
    </button>
    <button class="btn btn-outline-secondary w-100 btn-sm" onclick="showRegister()">
      Create new account
    </button>

    <!-- Register form (hidden by default) -->
    <div id="registerForm" class="d-none mt-3">
      <hr style="border-color: var(--border);"/>
      <div class="mb-2">
        <label class="form-label" for="regUser">New Username</label>
        <input type="text" class="form-control" id="regUser" placeholder="Choose a username"/>
      </div>
      <div class="mb-2">
        <label class="form-label" for="regPass">New Password</label>
        <input type="password" class="form-control" id="regPass" placeholder="Min 4 characters"/>
      </div>
      <button class="btn btn-success w-100 btn-sm" onclick="doRegister()">✅ Create Account</button>
    </div>

    <!-- Demo users quick-fill -->
    <div class="demo-users">
      <div class="label">Quick fill — demo users</div>
      <button class="demo-user-btn" onclick="fill('alice','alice123')">alice</button>
      <button class="demo-user-btn" onclick="fill('bob','bob123')">bob</button>
      <button class="demo-user-btn" onclick="fill('admin','admin123')">admin</button>
      <button class="demo-user-btn" onclick="fill('user1','pass1')">user1</button>
      <button class="demo-user-btn" onclick="fill('user2','pass2')">user2</button>
    </div>

    <div class="cookie-note">
      Sessions & Cookies — After login, a signed session cookie<br/>
      is stored in your browser. Every request sends it automatically.
    </div>
  </div>
</div>

<script>
function fill(u, p) {
  document.getElementById('username').value = u;
  document.getElementById('password').value = p;
}

function showRegister() {
  document.getElementById('registerForm').classList.toggle('d-none');
}

async function doLogin() {
  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value.trim();
  const status   = document.getElementById('loginStatus');

  if (!username || !password) {
    status.innerHTML = '<div class="alert alert-danger py-2 mb-3">Enter username and password.</div>';
    return;
  }

  document.getElementById('loginBtn').textContent = ' Logging in…';

  try {
    const res  = await fetch('/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password })
    });
    const data = await res.json();

    if (res.ok) {
      status.innerHTML = `<div class="alert alert-success py-2 mb-3">${data.message}</div>`;
      setTimeout(() => window.location.href = '/', 800);
    } else {
      status.innerHTML = `<div class="alert alert-danger py-2 mb-3"> ${data.error}</div>`;
      document.getElementById('loginBtn').textContent = 'Login';
    }
  } catch (e) {
    status.innerHTML = `<div class="alert alert-danger py-2 mb-3"> Network error: ${e.message}</div>`;
    document.getElementById('loginBtn').textContent = 'Login';
  }
}

async function doRegister() {
  const username = document.getElementById('regUser').value.trim();
  const password = document.getElementById('regPass').value.trim();
  const status   = document.getElementById('loginStatus');

  try {
    const res  = await fetch('/register', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password })
    });
    const data = await res.json();
    if (res.ok) {
      status.innerHTML = `<div class="alert alert-success py-2 mb-3">${data.message} — Logging you in…</div>`;
      document.getElementById('username').value = username;
      document.getElementById('password').value = password;
      setTimeout(doLogin, 800);
    } else {
      status.innerHTML = `<div class="alert alert-danger py-2 mb-3">${data.error}</div>`;
    }
  } catch (e) {
    status.innerHTML = `<div class="alert alert-danger py-2 mb-3">${e.message}</div>`;
  }
}

// Allow Enter key to submit
document.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') doLogin();
});
</script>
</body>
</html>
